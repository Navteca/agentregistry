# OIDC settings for local kind development, using the Keycloak deployment in
# scripts/kind/keycloak/ (installed via `make install-keycloak`).
#
# Usage:
#   make install-keycloak
#   helm upgrade --install agentregistry charts/agentregistry \
#     --kube-context kind-agentregistry \
#     --namespace agentregistry \
#     --reuse-values \
#     -f scripts/kind/values-oidc.yaml
#
# keycloakURL (browser-facing) and oidcIssuer (backend-facing) intentionally
# point at DIFFERENT addresses -- this is expected, not a bug. Keycloak's
# `hostname` + `hostname-strict=true` (set in scripts/kind/keycloak/keycloak.yaml)
# fixes the issuer advertised in tokens to the in-cluster Service DNS name
# regardless of which address a request actually arrived on, so the browser can
# reach Keycloak via the kind port mapping (keycloak.agentregistry.local:8080) while the backend
# pod validates tokens against the in-cluster DNS name it can reach directly.
# See https://www.keycloak.org/server/hostname.
hostAliases:
    - ip: "10.96.96.198"
    hostnames:
      - "keycloak.agentregistry.local"
config:
  # make install-agentregistry forces this to true by default; override for OIDC workflows
  enableAnonymousAuth: "false"
  # Browser-facing: reachable via the kind extraPortMapping in kind-config.yaml
  # (hostPort 8080 -> Keycloak's NodePort 30880). No port-forward or
  # /etc/hosts entry needed.
  keycloakURL: "http://keycloak.agentregistry.local:8080"
  keycloakRealm: "agentregistry"
  keycloakClientID: "agentregistry-api"
  oidcEnabled: "true"
  # Backend-facing: the agentregistry pod reaches Keycloak directly via
  # in-cluster Service DNS. Must exactly match the `iss` claim Keycloak embeds
  # in tokens (i.e. must match KC_HOSTNAME in scripts/kind/keycloak/keycloak.yaml).
  oidcIssuer: "http://keycloak.agentregistry.local:8080/realms/agentregistry"
  oidcClientID: "agentregistry-api"

  # Keep empty while validating connectivity. Set a claim rule once mapper is configured.
  # Example: '[{"ar_role":"publisher"}]'
  oidcExtraClaims: ""

  # NOTE: these are STATIC bundles applied to every authenticated OIDC user,
  # regardless of their Keycloak realm role (registry-user/registry-curator/
  # registry-admin from scripts/kind/keycloak/realm-export.json). The role-aware
  # mapping in internal/registry/api/handlers/v0/auth/oidc_roles.go
  # (OIDC_ROLE_CLAIM_PATH/OIDC_ROLE_MAP/OIDC_*_PATTERNS) is not currently wired
  # into OIDCHandler.buildPermissions (internal/registry/api/handlers/v0/auth/oidc.go)
  # -- it's exercised only by its own unit tests today. Logging in as any of the
  # four realm-export test users will get this same static bundle until that's
  # fixed. The Helm chart also doesn't yet template the role-mapping env vars
  # (only these static *Permissions keys are in configmap.yaml) -- moot until
  # buildPermissions is wired up, since it ignores them either way.
  oidcReadPermissions: "*"
  oidcPushPermissions: "*"
  oidcPublishPermissions: "*"
  oidcEditPermissions: "*"
  oidcDeletePermissions: "*"
  oidcDeployPermissions: "*"
