# OIDC settings for local kind development (Keycloak in-cluster).
#
# Usage:
#   helm upgrade --install agentregistry charts/agentregistry \
#     --kube-context kind-agentregistry \
#     --namespace agentregistry \
#     --reuse-values \
#     -f scripts/kind/values-oidc.yaml

config:
  # make install-agentregistry forces this to true by default; override for OIDC workflows
  enableAnonymousAuth: "false"
  keycloakURL: "http://keycloak.default.svc.cluster.local:8080"
  keycloakRealm: "agentregistry"
  keycloakClientID: "agentregistry-api"
  oidcEnabled: "true"
  oidcIssuer: "http://keycloak.default.svc.cluster.local:8080/realms/agentregistry"
  oidcClientID: "agentregistry-api"

  # Keep empty while validating connectivity. Set a claim rule once mapper is configured.
  # Example: '[{"ar_role":"publisher"}]'
  oidcExtraClaims: ""

  # Replace io.navteca/* with your desired namespace patterns.
  oidcReadPermissions: "*"
  oidcPushPermissions: "*"
  oidcPublishPermissions: "*"
  oidcEditPermissions: "*"
  oidcDeletePermissions: "*"
  oidcDeployPermissions: "*"
