apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentregistry.fullname" . }}-config
  labels:
    {{- include "agentregistry.labels" . | nindent 4 }}
  {{- $annotations := include "agentregistry.annotations" (dict "annotations" dict "context" $) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
data:
  AGENT_REGISTRY_SERVER_ADDRESS: {{ .Values.config.serverAddress | quote }}
  AGENT_REGISTRY_AGENT_GATEWAY_PORT: {{ .Values.config.agentGatewayPort | quote }}
  AGENT_REGISTRY_MCP_PORT: {{ .Values.config.agentRegistryMcpPort | quote }}
  AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION: {{ .Values.config.enableRegistryValidation | quote }}
  AGENT_REGISTRY_ENABLE_ANONYMOUS_AUTH: {{ .Values.config.enableAnonymousAuth | quote }}
  AGENT_REGISTRY_DISABLE_BUILTIN_SEED: {{ .Values.config.disableBuiltinSeed | quote }}
  {{- if .Values.config.seedFrom }}
  AGENT_REGISTRY_SEED_FROM: {{ .Values.config.seedFrom | quote }}
  {{- end }}
  {{- if .Values.config.keycloakURL }}
  AGENT_REGISTRY_KEYCLOAK_URL: {{ .Values.config.keycloakURL | quote }}
  {{- end }}
  {{- if .Values.config.keycloakRealm }}
  AGENT_REGISTRY_KEYCLOAK_REALM: {{ .Values.config.keycloakRealm | quote }}
  {{- end }}
  {{- if .Values.config.keycloakClientID }}
  AGENT_REGISTRY_KEYCLOAK_CLIENT_ID: {{ .Values.config.keycloakClientID | quote }}
  {{- end }}
  {{- if .Values.config.frontendApiURL }}
  AGENT_REGISTRY_FRONTEND_API_URL: {{ .Values.config.frontendApiURL | quote }}
  {{- end }}
  {{- if .Values.config.frontendGatewayURL }}
  AGENT_REGISTRY_FRONTEND_GATEWAY_URL: {{ .Values.config.frontendGatewayURL | quote }}
  {{- end }}
  AGENT_REGISTRY_SHOW_GITHUB_LINK: {{ .Values.config.showGithubLink | quote }}
  AGENT_REGISTRY_SHOW_DISCORD_LINK: {{ .Values.config.showDiscordLink | quote }}
  {{- if ne (printf "%v" .Values.config.oidcEnabled) "" }}
  AGENT_REGISTRY_OIDC_ENABLED: {{ printf "%v" .Values.config.oidcEnabled | quote }}
  {{- end }}
  {{- if .Values.config.oidcIssuer }}
  AGENT_REGISTRY_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  {{- end }}
  {{- if .Values.config.oidcClientID }}
  AGENT_REGISTRY_OIDC_CLIENT_ID: {{ .Values.config.oidcClientID | quote }}
  {{- end }}
  {{- if .Values.config.oidcExtraClaims }}
  AGENT_REGISTRY_OIDC_EXTRA_CLAIMS: {{ .Values.config.oidcExtraClaims | quote }}
  {{- end }}
  {{- if .Values.config.oidcRoleClaimPath }}
  AGENT_REGISTRY_OIDC_ROLE_CLAIM_PATH: {{ .Values.config.oidcRoleClaimPath | quote }}
  {{- end }}
  {{- if .Values.config.oidcDisplayNameClaimPath }}
  AGENT_REGISTRY_OIDC_DISPLAY_NAME_CLAIM_PATH: {{ .Values.config.oidcDisplayNameClaimPath | quote }}
  {{- end }}
  {{- if .Values.config.oidcRoleMap }}
  AGENT_REGISTRY_OIDC_ROLE_MAP: {{ .Values.config.oidcRoleMap | quote }}
  {{- end }}
  {{- if .Values.config.oidcUserPatterns }}
  AGENT_REGISTRY_OIDC_USER_PATTERNS: {{ .Values.config.oidcUserPatterns | quote }}
  {{- end }}
  {{- if .Values.config.oidcCuratorPatterns }}
  AGENT_REGISTRY_OIDC_CURATOR_PATTERNS: {{ .Values.config.oidcCuratorPatterns | quote }}
  {{- end }}
  {{- if .Values.config.oidcAdminPatterns }}
  AGENT_REGISTRY_OIDC_ADMIN_PATTERNS: {{ .Values.config.oidcAdminPatterns | quote }}
  {{- end }}
  {{- if .Values.config.oidcEditPermissions }}
  AGENT_REGISTRY_OIDC_EDIT_PERMISSIONS: {{ .Values.config.oidcEditPermissions | quote }}
  {{- end }}
  {{- if .Values.config.oidcPublishPermissions }}
  AGENT_REGISTRY_OIDC_PUBLISH_PERMISSIONS: {{ .Values.config.oidcPublishPermissions | quote }}
  {{- end }}
  {{- if .Values.config.oidcReadPermissions }}
  AGENT_REGISTRY_OIDC_READ_PERMISSIONS: {{ .Values.config.oidcReadPermissions | quote }}
  {{- end }}
  {{- if .Values.config.oidcPushPermissions }}
  AGENT_REGISTRY_OIDC_PUSH_PERMISSIONS: {{ .Values.config.oidcPushPermissions | quote }}
  {{- end }}
  {{- if .Values.config.oidcDeletePermissions }}
  AGENT_REGISTRY_OIDC_DELETE_PERMISSIONS: {{ .Values.config.oidcDeletePermissions | quote }}
  {{- end }}
  {{- if .Values.config.oidcDeployPermissions }}
  AGENT_REGISTRY_OIDC_DEPLOY_PERMISSIONS: {{ .Values.config.oidcDeployPermissions | quote }}
  {{- end }}
  {{- if .Values.config.mcpScoringURL }}
  AGENT_REGISTRY_MCP_SCORING_URL: {{ .Values.config.mcpScoringURL | quote }}
  {{- end }}
  {{- if .Values.config.mcpScoringTimeout }}
  AGENT_REGISTRY_MCP_SCORING_TIMEOUT: {{ .Values.config.mcpScoringTimeout | quote }}
  {{- end }}
